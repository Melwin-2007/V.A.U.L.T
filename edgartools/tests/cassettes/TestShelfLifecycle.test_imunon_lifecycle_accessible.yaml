        quarterly filings with the SEC, as well as other information in this prospectus
        and any\nprospectus supplements and the documents incorporated by reference
        herein or therein, before purchasing our securities. Each of the risk\nfactors
        could adversely affect our business, operating results and financial condition,
        as well as adversely affect the value of an investment\nin our securities.</I></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\"><I>&nbsp;</I></FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><B><I>About\nImunon,
        Inc.</I></B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">Imunon\nis a clinical-stage biotechnology company focused
        on advancing a portfolio of innovative treatments that harness the body&rsquo;s
        natural\nmechanisms with the aim to generate safe, effective and durable responses
        across a broad array of human diseases, constituting a differentiating\napproach
        from conventional therapies. IMUNON is developing its non-viral DNA technology
        across its modalities. The first modality, TheraPlas<SUP>&reg;</SUP>,\nis
        developed for the coding of proteins and cytokines in the treatment of solid
        tumors where an immunological approach is deemed promising.\nThe second modality,
        PlaCCine<SUP>&reg;</SUP>, is developed for the coding of viral antigens that
        can elicit a strong immunological response.\nThis technology may represent
        a promising platform for the development of vaccines in infectious diseases.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">The\nCompany&rsquo;s
        lead clinical program, IMNN-001, is a DNA-based immunotherapy for the localized
        treatment of advanced ovarian cancer\ncurrently in Phase II development. IMNN-001
        works by instructing the body to produce durable levels, within certain safety
        parameters,\nof powerful cancer-fighting molecules, such as interleukin-12
        and interferon gamma, at the tumor site. Additionally, the Company is entering\na
        first-in-human study of its COVID-19 booster vaccine (IMNN-101). We will continue
        to leverage these modalities and to advance the technological\nfrontier of
        plasmid DNA to better serve patients with difficult-to-treat conditions.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
