        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><B><I>Enforceability\nof
        Rights by Holders of Units</I></B></FONT></P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><B><I>&nbsp;</I></B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">Each\nunit agent will act solely as our agent under the applicable
        unit agreement and will not assume any obligation or relationship of agency\nor
        trust with any holder of any unit. A single bank or trust company may act
        as unit agent for more than one series of units. A unit\nagent will have no
        duty or responsibility in case of any default by us under the applicable unit
        agreement or unit, including any duty\nor responsibility to initiate any proceedings
        at law or otherwise, or to make any demand upon us. Any holder of a unit may,
        without the\nconsent of the related unit agent or the holder of any other
        unit, enforce by appropriate legal action its rights as holder under any\nsecurity
        included in the unit.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n\n<!--
        Field: Page; Sequence: 21; Value: 1 -->\n    <DIV STYLE=\"margin-bottom: 6pt;
        border-bottom: Black 1pt solid\"><TABLE CELLPADDING=\"0\" CELLSPACING=\"0\"
        STYLE=\"border-collapse: collapse; width: 100%; font-size: 10pt\"><TR STYLE=\"vertical-align:
        top; text-align: left\"><TD STYLE=\"text-align: center; width: 100%\"><!--
        Field: Sequence; Type: Arabic; Name: PageNo -->17<!-- Field: /Sequence --></TD></TR></TABLE></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt\"><P STYLE=\"margin:
        0pt\">&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><B>&nbsp;</B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        center\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B><A NAME=\"Su_013\"></A>CERTAIN\nPROVISIONS OF DELAWARE LAW AND</B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        center\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B>OF\nTHE COMPANY&rsquo;S CERTIFICATE OF INCORPORATION AND BYLAWS</B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        center\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B>&nbsp;</B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\"><B><I>Certificate\nof Incorporation
        and Bylaws</I></B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">A\nnumber of provisions of our certificate of incorporation
        and bylaws concern matters of corporate governance and the rights of our stockholders.\nProvisions
        that grant our Board the ability to issue shares of preferred stock and to
        set the voting rights, preferences and other terms\nthereof may discourage
        takeover attempts that are not first approved by our Board, including takeovers
        that may be considered by some\nstockholders to be in their best interests,
        such as those attempts that might result in a premium over the market price
        for the shares\nheld by stockholders. Certain provisions could delay or impede
        the removal of incumbent directors even if such removal would be beneficial\nto
        our stockholders, such as the classification of our Board and the lack of
        cumulative voting. Since our Board has the power to retain\nand discharge
        our officers, these provisions could also make it more difficult for existing
        stockholders or another party to effect a\nchange in management.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">These\nprovisions may have the effect of deterring hostile
        takeovers or delaying changes in our control or in our management. These provisions\nare
        intended to enhance the likelihood of continued stability in the composition
        of our Board and in the policies it implements and to\ndiscourage certain
        types of transactions that may involve an actual or threatened change of our
        control. These provisions are designed\nto reduce our vulnerability to an
        unsolicited acquisition proposal. The provisions also are intended to discourage
        certain tactics that\nmay be used in proxy fights. However, such provisions
        could have the effect of discouraging others from making tender offers for
        our\nshares and, as a consequence, they also may inhibit fluctuations in the
        market price of our shares that could result from actual or rumored\ntakeover
        attempts.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">These\nprovisions also could discourage or make more difficult
        a merger, tender offer or proxy contest, even if they could be favorable to
        the\ninterests of stockholders and could potentially depress the market price
        of our common stock. Our Board believes that these provisions\nare appropriate
        to protect our interests and the interests of our stockholders.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\"><I>Classification\nof Board; No Cumulative Voting.</I> Our
        certificate of incorporation and bylaws provide for our Board to be divided
        into three classes,\nwith staggered three-year terms. Only one class of directors
        is elected at each annual meeting of our stockholders, with the other classes\ncontinuing
        for the remainder of their respective three-year terms. Because our stockholders
        do not have cumulative voting rights, our\nstockholders representing a majority
        of the shares of common stock outstanding will be able to elect those directors
        due to be elected\nat each annual meeting of our stockholders.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\"><I>Meetings\nof and Actions by Stockholders.</I> Our bylaws
        provide that annual meetings of our stockholders may take place at the time
        and place\ndesignated by our Board. A special meeting of our stockholders
        may be called at any time by our Board, the chairman of our Board or our\npresident.
        Our bylaws provide that (i) our Board can fix separate record dates for determining
        stockholders entitled to receive notice\nof a stockholder meeting and for
        determining stockholders entitled to vote at the meeting; (ii) we may hold
        a stockholder meeting by\nmeans of remote communications; (iii) any stockholder
        seeking to have the stockholders authorize or take corporate action by written\nconsent
        shall, by written notice to our secretary, request that our Board fix a record
        date and our Board shall adopt a resolution fixing\nthe record date in all
        events within 10 calendar days after a request is received; and (iv) a written
        consent of stockholders shall not\nbe effective unless a written consent signed
        by a sufficient number of stockholders to take such action is received by
        us within 60 calendar\ndays of the earliest dated written consent received.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\"><I>Advance\nNotice Requirements for Stockholder Proposals
        and Director Nominations. </I>Our bylaws provide that stockholders seeking
        to bring business\nbefore an annual meeting of stockholders or to nominate
        candidates for election as directors at an annual meeting of stockholders
        must\nprovide timely notice in writing. To be timely, a stockholder&rsquo;s
        notice must be delivered to, or mailed and received by, our secretary\nat
        our principal executive offices not later than the close of business on the
        90th calendar day, nor earlier than the close of business\non the 120th calendar
        day in advance of the date specified in our proxy statement released to stockholders
        in connection with the previous\nyear&rsquo;s annual meeting of stockholders.
        If the date of the annual meeting is more than 30 calendar days before or
        after such anniversary\ndate, notice by the stockholder to be timely must
        be not earlier than the close of business on the 120th calendar day in advance
        of such\ndate of annual meeting and not later than the close of business on
        the later of the 90th calendar day in advance of such date of annual\nmeeting
        or the tenth calendar day following the date on which public announcement
        of the date of the meeting is made. In no event shall\nthe public announcement
        of an adjournment or postponement of an annual meeting commence a new time
        period (or extend any time period)\nfor the giving of an advance notice by
        any stockholder. Any stockholder that proposes director nominations or other
        business must be\na stockholder of record at the time the advance notice is
        delivered by such stockholder to us and entitled to vote at the meeting. Our\nbylaws
        also specify requirements as to the form and content of a stockholder&rsquo;s
        notice. These provisions may preclude stockholders\nfrom bringing matters
        before an annual meeting of stockholders or from making nominations for the
        election of directors at an annual\nmeeting of stockholders. Unless otherwise
        required by law, any director nomination or other business shall not be made
        or transacted\nif the stockholder (or a qualified representative of the stockholder)
        does not appear at the meeting to present the director nominee\nor other proposed
        business.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n\n<!--
        Field: Page; Sequence: 22; Value: 1 -->\n    <DIV STYLE=\"margin-bottom: 6pt;
        border-bottom: Black 1pt solid\"><TABLE CELLPADDING=\"0\" CELLSPACING=\"0\"
        STYLE=\"border-collapse: collapse; width: 100%; font-size: 10pt\"><TR STYLE=\"vertical-align:
        top; text-align: left\"><TD STYLE=\"text-align: center; width: 100%\"><!--
        Field: Sequence; Type: Arabic; Name: PageNo -->18<!-- Field: /Sequence --></TD></TR></TABLE></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt\"><P STYLE=\"margin:
        0pt\">&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\"><I>&nbsp;</I></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\"><I>Filling\nof Board Vacancies.</I> Our certificate
        of incorporation and bylaws provide that the authorized size of our Board
        shall be determined\nby our Board by Board resolution from time to time and
        that our Board has the exclusive power to fill any vacancies and newly created\ndirectorships
        resulting from any increase in the authorized number of directors and the
        stockholders do not have the power to fill such\nvacancies. Vacancies in our
        Board and newly created directorships resulting from any increase in the authorized
        number of directors on\nour board may be filled by a majority of the directors
        remaining in office, even though that number may be less than a quorum of
        our\nboard, or by a sole remaining director. A director so elected to fill
        a vacancy shall serve for the remaining term of the predecessor\nhe or she
        replaced and until his or her successor is elected and has qualified, or until
        his or her earlier resignation, removal or death.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><I>Amendment\nof
        the Certificate of Incorporation.</I> Our certificate of incorporation may
        be amended, altered, changed or repealed at a meeting of\nour stockholders
        entitled to vote thereon by the affirmative vote of a majority of the outstanding
        stock entitled to vote thereon and\na majority of the outstanding stock of
        each class entitled to vote thereon as a class, or in the manner prescribed
        by the DGCL.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\"><I>Amendment\nof the Bylaws.</I> Our bylaws may be amended
        or repealed, or new bylaws may be adopted, by either our Board or the affirmative
        vote of\nat least 66 2/3% of the voting power of our outstanding shares.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><B><I>Section\n203
        of the DGCL</I></B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">We\nare subject to Section 203 of the Delaware General Corporation
        Law, or DGCL, which prohibits a Delaware corporation from engaging in\nany
        business combination with any interested stockholder for a period of three
        years after the date that such stockholder became an interested\nstockholder,
        with the following exceptions:</FONT></P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent:
        0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" STYLE=\"width:
        100%; font: 10pt Times New Roman, Times, Serif; margin-top: 0; margin-bottom:
        0\"><TR STYLE=\"font: 10pt Times New Roman, Times, Serif; vertical-align:
        top\">\n<TD STYLE=\"font: 10pt Times New Roman, Times, Serif; width: 0.75in\"></TD><TD
        STYLE=\"font: 10pt Times New Roman, Times, Serif; width: 0.25in\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&#9679;</FONT></TD><TD STYLE=\"font:
        10pt Times New Roman, Times, Serif; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">before\n                                            such
        date, the board of directors of the corporation approved either the business
        combination\n                                            or the transaction
        that resulted in the stockholder becoming an interested stockholder;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 63pt;
        text-align: justify; text-indent: -0.25in\"><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" STYLE=\"width: 100%; font: 10pt Times New Roman, Times,
        Serif; margin-top: 0; margin-bottom: 0\"><TR STYLE=\"font: 10pt Times New
        Roman, Times, Serif; vertical-align: top\">\n<TD STYLE=\"font: 10pt Times
        New Roman, Times, Serif; width: 0.75in\"></TD><TD STYLE=\"font: 10pt Times
        New Roman, Times, Serif; width: 0.25in\"><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt\">&#9679;</FONT></TD><TD STYLE=\"font:
        10pt Times New Roman, Times, Serif; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">upon\n                                            completion
        of the transaction that resulted in the stockholder becoming an interested
        stockholder,\n                                            the interested stockholder
        owned at least 85% of the voting stock of the corporation outstanding\n                                            at
        the time the transaction began, excluding for purposes of determining the
        voting stock\n                                            outstanding (but
        not the outstanding voting stock owned by the interested stockholder) those\n
        \                                           shares owned (i) by persons who
        are directors and also officers and (ii) pursuant to employee\n                                            stock
        plans in which employee participants do not have the right to determine confidentially\n
        \                                           whether shares held subject to
        the plan will be tendered in a tender or exchange offer; and</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 63pt;
        text-align: justify; text-indent: -0.25in\"><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" STYLE=\"width: 100%; font: 10pt Times New Roman, Times,
        Serif; margin-top: 0; margin-bottom: 0\"><TR STYLE=\"font: 10pt Times New
        Roman, Times, Serif; vertical-align: top\">\n<TD STYLE=\"font: 10pt Times
        New Roman, Times, Serif; width: 0.75in\"></TD><TD STYLE=\"font: 10pt Times
        New Roman, Times, Serif; width: 0.25in\"><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt\">&#9679;</FONT></TD><TD STYLE=\"font:
        10pt Times New Roman, Times, Serif; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">on\n                                            or
        after such date, the business combination is approved by the board of directors
        and authorized\n                                            at an annual or
        special meeting of the stockholders, and not by written consent, by the affirmative\n
        \                                           vote of at least 66 2/3% of the
        outstanding voting stock that is not owned by the interested\n                                            stockholder.</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 63pt;
        text-align: justify; text-indent: -0.25in\"><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">In\ngeneral,
        Section 203 defines a business combination to include the following:</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" STYLE=\"width:
        100%; font: 10pt Times New Roman, Times, Serif; margin-top: 0; margin-bottom:
        0\"><TR STYLE=\"font: 10pt Times New Roman, Times, Serif; vertical-align:
        top\">\n<TD STYLE=\"font: 10pt Times New Roman, Times, Serif; width: 0.75in\"></TD><TD
        STYLE=\"font: 10pt Times New Roman, Times, Serif; width: 0.25in\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&#9679;</FONT></TD><TD STYLE=\"font:
        10pt Times New Roman, Times, Serif; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">any\n                                            merger
        or consolidation involving the corporation and the interested stockholder
        or with\n                                            any other corporation,
        partnership, unincorporated association or other entity if the merger\n                                            or
        consolidation is caused by the interested stockholder;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 63pt;
        text-align: justify; text-indent: -0.25in\"><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" STYLE=\"width: 100%; font: 10pt Times New Roman, Times,
        Serif; margin-top: 0; margin-bottom: 0\"><TR STYLE=\"font: 10pt Times New
        Roman, Times, Serif; vertical-align: top\">\n<TD STYLE=\"font: 10pt Times
        New Roman, Times, Serif; width: 0.75in\"></TD><TD STYLE=\"font: 10pt Times
        New Roman, Times, Serif; width: 0.25in\"><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt\">&#9679;</FONT></TD><TD STYLE=\"font:
        10pt Times New Roman, Times, Serif; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">any\n                                            sale,
        lease, transfer, pledge or other disposition of 10% or more of the assets
        of the corporation\n                                            to or with
        the interested stockholder;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 63pt; text-align: justify;
        text-indent: -0.25in\"><FONT STYLE=\"font-family: Times New Roman, Times,
        Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\"
        STYLE=\"width: 100%; font: 10pt Times New Roman, Times, Serif; margin-top:
        0; margin-bottom: 0\"><TR STYLE=\"font: 10pt Times New Roman, Times, Serif;
        vertical-align: top\">\n<TD STYLE=\"font: 10pt Times New Roman, Times, Serif;
        width: 0.75in\"></TD><TD STYLE=\"font: 10pt Times New Roman, Times, Serif;
        width: 0.25in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&#9679;</FONT></TD><TD STYLE=\"font: 10pt Times New Roman,
        Times, Serif; text-align: justify\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">subject\n                                            to
        certain exceptions, any transaction that results in the issuance or transfer
        by the corporation\n                                            of any stock
        of the corporation to the interested stockholder;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 63pt;
        text-align: justify; text-indent: -0.25in\"><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" STYLE=\"width: 100%; font: 10pt Times New Roman, Times,
        Serif; margin-top: 0; margin-bottom: 0\"><TR STYLE=\"font: 10pt Times New
        Roman, Times, Serif; vertical-align: top\">\n<TD STYLE=\"font: 10pt Times
        New Roman, Times, Serif; width: 0.75in\"></TD><TD STYLE=\"font: 10pt Times
