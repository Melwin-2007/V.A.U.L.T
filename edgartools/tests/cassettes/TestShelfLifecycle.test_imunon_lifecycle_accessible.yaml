        NAME=\"Su_017\"></A>WHERE\nYOU CAN FIND MORE INFORMATION</B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        center\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B>&nbsp;</B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">We\nfile
        reports, proxy statements and other information with the SEC. The SEC maintains
        a website that contains reports, proxy and information\nstatements and other
        information about issuers, such as us, who file electronically with the SEC.
        The address of that website is <I>http://www.sec.gov</I>.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">Our\nweb site address is <I>http://www.imunon.com</I>. There
        we make available free of charge, on or through the investor relations section\nof
        our website, annual reports on Form 10-K, quarterly reports on Form 10-Q,
        current reports on Form 8-K and amendments to those reports\nfiled pursuant
        to Section 13(a) or 15(d) of the Exchange Act as soon as reasonably practicable
        after we electronically file such material\nwith the SEC. The information
        on our web site, however, is not, and should not be deemed to be, a part of
        this prospectus. All website\naddresses in this prospectus are intended to
        be inactive textual references only.</FONT></P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent:
        0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">This\nprospectus
        is part of a registration statement that we filed with the SEC and does not
        contain all of the information in the registration\nstatement. The full registration
        statement may be obtained from the SEC or us, as provided below. You may inspect
        a copy of the registration\nstatement through the SEC&rsquo;s website, as
        provided above.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        center\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B><A NAME=\"Su_018\"></A>INCORPORATION\nOF DOCUMENTS BY REFERENCE</B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        center\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B>&nbsp;</B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">The\nSEC
        allows us to &ldquo;incorporate by reference&rdquo; information that we file
        with them. Incorporation by reference allows us to disclose\nimportant information
        to you by referring you to those other documents. The information incorporated
        by reference is an important part\nof this prospectus, and information that
        we file later with the SEC will automatically update and supersede this information.
        We filed\na registration statement on Form S-3 under the Securities Act with
        the SEC with respect to the securities we may offer pursuant to this\nprospectus.
        This prospectus omits certain information contained in the registration statement,
        as permitted by the SEC. You should refer\nto the registration statement,
        including the exhibits, for further information about us and the securities
        we may offer pursuant to this\nprospectus. Statements in this prospectus regarding
        the provisions of certain documents filed with, or incorporated by reference
        in,\nthe registration statement are not necessarily complete and each statement
        is qualified in all respects by that reference. Copies of\nall or any part
        of the registration statement, including the documents incorporated by reference
        or the exhibits, may be obtained upon\npayment of the prescribed rates at
        the offices of the SEC listed above in &ldquo;Where You Can Find More Information.&rdquo;
        The documents\nwe are incorporating by reference are:</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
