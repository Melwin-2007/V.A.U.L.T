        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt; background-color: white\">The\nWarrants will be exercisable,
        at the option of each holder, in whole or in part, by delivering a duly executed
        exercise notice accompanied\nby payment in full for the number of shares of
        our common stock purchased upon such exercise. Except as agreed with individual
        holders\nof Warrants, a holder (together with its affiliates) may not exercise
        any portion of the Warrant to the extent that the holder would\nown more than
        4.99% (or, at the election of the holder, 9.99% of our outstanding shares
        of common stock immediately after exercise (the\n&ldquo;Warrant Beneficial
        Ownership Limitation&rdquo;), except that upon at least 61 days&rsquo; prior
        notice from the holder to us,\nthe holder may increase the Warrant Beneficial
        Ownership Limitation to a percentage not to exceed 9.99%. No fractional shares
        of common\nstock will be issued in connection with the exercise of a Warrant.
        In lieu of fractional shares, we will pay the holder an amount in\ncash equal
        to the fractional amount multiplied by the exercise price.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt; background-color: white\"><I>Cashless\nExercise</I></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">If,\nat the time a holder exercises its Warrants, a registration
        statement registering the issuance of the shares of common stock underlying\nthe
        Warrants under the Securities Act is not then effective or available for the
        issuance of such shares, then in lieu of making the\ncash payment otherwise
        contemplated to be made to us upon such exercise in payment of the aggregate
        exercise price, the holder may elect\ninstead to receive upon such exercise
        (either in whole or in part) the net number of shares of common stock determined
        according to a\nformula set forth in the Warrants.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt; background-color:
        white\"><I>Fundamental\nTransaction</I></FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">In\nthe
        event of a fundamental transaction, as described in the Warrants and generally
        including merger or consolidation of our Company or\nthe sale of all or substantially
        all of our Company&rsquo;s capital stock or assets, the holders of the Warrants
        will be entitled to\nreceive upon exercise of the Warrants the kind and amount
        of securities, cash or other property that the holders would have received\nhad
        they exercised the Warrants immediately prior to such fundamental transaction.
        Notwithstanding the foregoing, in the event of a fundamental\ntransaction,
        the holders of the Warrants have the right to require us or a successor entity
        to redeem the Warrants for cash in the amount\nof the Black Scholes Value
        (as defined in the Warrants) of the unexercised portion of the Warrants concurrently
        with or within 30 days\nfollowing the consummation of a fundamental transaction.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n\n<!-- Field: Page; Sequence:
        14; Value: 1 -->\n    <DIV STYLE=\"margin-bottom: 6pt; border-bottom: Black
        1pt solid\"><TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" STYLE=\"border-collapse:
        collapse; width: 100%; font-size: 10pt\"><TR STYLE=\"vertical-align: top;
        text-align: left\"><TD STYLE=\"text-align: center; width: 100%\">S-<!-- Field:
        Sequence; Type: Arabic; Name: PageNo -->11<!-- Field: /Sequence --></TD></TR></TABLE></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt\">&nbsp;</DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0pt 0pt 0\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">However,\nin
        the event of a fundamental transaction which is not in our control, including
        a fundamental transaction not approved by our board\nof directors, the holders
        of the Warrants will only be entitled to receive from us or our successor
        entity, as of the date of consummation\nof such fundamental transaction, the
        same type or form of consideration (and in the same proportion), at the Black
        Scholes Value of the\nunexercised portion of the Warrants that is being offered
        and paid to the holders of our common stock in connection with the fundamental\ntransaction,
        whether that consideration is in the form of cash, stock or any combination
        of cash and stock, or whether the holders of\nour common stock are given the
        choice to receive alternative forms of consideration in connection with the
        fundamental transaction. If\nholders of our common stock are not offered or
        paid any consideration in a fundamental transaction, such holders of our common
        stock\nwill be deemed to have received shares of the successor entity in such
        fundamental transaction, and holders of the Warrants will receive\nshares
        of the successor entity in the amount of the Black Scholes Value.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt; background-color: white\"><I>Transferability</I></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
