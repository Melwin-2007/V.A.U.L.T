        0.45in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">We\nmay issue warrants to purchase shares of our common stock, preferred
        stock and/or debt securities in one or more series together with\nother securities
        or separately, as described in the applicable prospectus supplement. Below
        is a description of certain general terms\nand provisions of the warrants
        that we may offer. Particular terms of the warrants will be described in the
        warrant agreements and the\nprospectus supplement relating to the warrants.</FONT></P>\n\n<P
