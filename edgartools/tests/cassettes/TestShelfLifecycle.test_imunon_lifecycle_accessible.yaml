        \   <!-- Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">Subject\nto the terms of the indenture, and except as we
        may otherwise provide in a prospectus supplement, if an event of default under
        the indenture\nshall occur and be continuing, the trustee will be under no
        obligation to exercise any of its rights or powers under such indenture at\nthe
        request or direction of any of the holders of the applicable series, unless
        such holders have offered the trustee reasonable indemnity.\nThe holders of
        a majority in principal amount of any series will have the right to direct
