        securities that may be issued thereunder and will provide\nthat the specific
        terms of any series of debt securities shall be set forth in, or determined
        pursuant to, an authorizing resolution,\nan officers&rsquo; certificate or
        a supplemental indenture, if any, relating to such series.</FONT></P>\n\n<P
