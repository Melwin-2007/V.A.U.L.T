        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B><I>About\nImunon, Inc.</I></B></FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">We\nare a clinical-stage biotechnology company
        focused on advancing a portfolio of innovative treatments that harness the
        body&rsquo;s natural\nmechanisms with the aim to generate safe, effective
        and durable responses across a broad array of human diseases, constituting
        a differentiating\napproach from conventional therapies. We are developing
        our non-viral DNA technology across its modalities. The first modality, TheraPlas<SUP>&reg;</SUP>,\nis
        developed for the coding of proteins and cytokines and other therapeutic proteins
        in the treatment of solid tumors where an immunological\napproach is deemed
        promising. The second modality, PlaCCine<SUP>&reg;</SUP>, is developed for
        the delivery of DNA-coded viral antigens\nthat can elicit a strong immunological
        response. This technology may represent a promising platform for the development
        of vaccines in\ninfectious disease.</FONT></P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent:
        0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">Our\nlead
        clinical program, IMNN-001, is a DNA-based immunotherapy for the localized
        treatment of advanced ovarian cancer that has completed\nmultiple clinical
        trials including one Phase II clinical trial (OVATION 2) and is currently
        conducting a Phase III clinical trial (OVATION\n3). IMNN-001 works by instructing
        the body to produce safe and durable levels of powerful cancer-fighting molecules,
        such as interleukin-12\nand interferon gamma, at the tumor site. Additionally,
        we have completed dosing in a first-in-human study of its COVID-19 booster
        vaccine\n(IMNN-101). We will continue to leverage these modalities and to
        advance, either directly or through partnership, the technological frontier\nof
        plasmid DNA to better serve patients with difficult-to-treat conditions.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
