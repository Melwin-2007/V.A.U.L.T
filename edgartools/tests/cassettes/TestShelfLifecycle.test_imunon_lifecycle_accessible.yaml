        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">The\nfollowing
        description, together with the additional information that we include in any
        applicable prospectus supplements summarizes the\nmaterial terms and provisions
        of the units that we may offer under this prospectus. While the terms we have
        summarized below will apply\ngenerally to any units that we may offer under
        this prospectus, we will describe the particular terms of any series of units
        in more\ndetail in the applicable prospectus supplement. The terms of any
        units offered under a prospectus supplement may differ from the terms\ndescribed
        below.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">We\nwill incorporate by reference from reports that we file
        with the SEC, the form of unit agreement that describes the terms of the series\nof
        units we are offering, and any supplemental agreements, before the issuance
        of the related series of units. The following summaries\nof material terms
        and provisions of the units are subject to, and qualified in their entirety
        by reference to, all the provisions of\nthe unit agreement and any supplemental
        agreements applicable to a particular series of units. We urge you to read
        the applicable prospectus\nsupplements related to the particular series of
        units that we may offer under this prospectus, as well as any related free
        writing prospectuses\nand the complete unit agreement and any supplemental
        agreements that contain the terms of the units.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\"><B><I>General</I></B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B><I>&nbsp;</I></B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent:
        0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">We\nmay issue units consisting of common stock, preferred stock, one
        or more debt securities, warrants or rights for the purchase of common\nstock,
        preferred stock and/or debt securities in one or more series, in any combination.
        Each unit will be issued so that the holder\nof the unit is also the holder
        of each security included in the unit. Thus, the holder of a unit will have
        the rights and obligations\nof a holder of each security included in the unit.
        The unit agreement under which a unit is issued may provide that the securities
        included\nin the unit may not be held or transferred separately, at any time
        or at any time before a specified date.</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
