        \   <!-- Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\"><B><I>&nbsp;</I></B></FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><B><I>Form,\nExchange,
        and Transfer</I></B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\"><B><I>&nbsp;</I></B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">Except\nas we may otherwise provide in a prospectus
        supplement, we will issue debt securities only in fully registered form without
        coupons and,\nunless we otherwise specify in the applicable prospectus supplement,
        in denominations of $1,000 and any integral multiple thereof. Except\nas we
        may otherwise provide in a prospectus supplement, the indenture will provide
        that we may issue debt securities in temporary or\npermanent global form and
        as book-entry securities that will be deposited with a depositary named by
        us and identified in a prospectus\nsupplement with respect to that series.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">At\nthe option of the holder, subject to the terms of the
        indenture and the limitations applicable to global securities described in
        the\napplicable prospectus supplement, the holder will be able to exchange
        the debt securities for other debt securities of the same series,\nin any
        authorized denomination and of like tenor and aggregate principal amount.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">Subject\nto the terms of the indenture and the limitations
        applicable to global securities set forth in the applicable prospectus supplement,\nholders
        may present the debt securities for exchange or for registration of transfer,
        duly endorsed or with the form of transfer endorsed\nthereon duly executed
        if so required by us or the security registrar, at the office of the security
        registrar or at the office of any\ntransfer agent designated by us for this
        purpose. Unless otherwise provided in the debt securities or the indenture,
        we will make no\nservice charge for any registration of transfer or exchange,
        but we may require payment of any taxes or other governmental charges.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">We\nwill name in the applicable prospectus supplement the
        security registrar, and any transfer agent in addition to the security registrar,\nthat
        we initially designate for any debt securities. We may at any time designate
        additional transfer agents or rescind the designation\nof any transfer agent
        or approve a change in the office through which any transfer agent acts, except
        that we will be required to maintain\na transfer agent in each place of payment
        for the debt securities of each series.</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">Except\nas
        we may otherwise provide in a prospectus supplement, if we elect to redeem
        the debt securities of any series, we will not be required\nto:</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" STYLE=\"width: 100%; font: 10pt Times New Roman, Times,
        Serif; margin-top: 0; margin-bottom: 0\"><TR STYLE=\"font: 10pt Times New
        Roman, Times, Serif; vertical-align: top\">\n<TD STYLE=\"font: 10pt Times
        New Roman, Times, Serif; width: 0.75in\"></TD><TD STYLE=\"font: 10pt Times
        New Roman, Times, Serif; width: 0.25in\"><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt\">&#9679;</FONT></TD><TD STYLE=\"font:
        10pt Times New Roman, Times, Serif; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">issue,\n                                            register
        the transfer of, or exchange any debt securities of that series during a period\n
        \                                           beginning at the opening of business
        15 days before the day of mailing of a notice of redemption\n                                            of
        any debt securities that may be selected for redemption and ending at the
        close of business\n                                            on the day
        of the mailing; or</FONT></TD></TR></TABLE>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0pt 0pt 63pt; text-align: justify; text-indent:
        -0.25in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
