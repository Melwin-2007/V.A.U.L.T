        \   <DIV STYLE=\"margin-bottom: 6pt; border-bottom: Black 1pt solid\"><TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" STYLE=\"border-collapse: collapse; width:
        100%; font-size: 10pt\"><TR STYLE=\"vertical-align: top; text-align: left\"><TD
        STYLE=\"text-align: center; width: 100%\">S-<!-- Field: Sequence; Type: Arabic;
        Name: PageNo -->2<!-- Field: /Sequence --></TD></TR></TABLE></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt\">&nbsp;</DIV>\n    <!-- Field:
        /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0pt 0pt 0\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: center\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; text-transform: uppercase\"><B><A
        NAME=\"sd_004\"></A>RISK\nFACTORS</B></FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: center\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><I>An\ninvestment in our securities involves a high degree of risk.
        Before deciding whether to invest in our securities, you should consider\ncarefully
        the risks discussed below, together with the risks under the heading &ldquo;Risk
        Factors&rdquo; under Part I, Item IA of our\nAnnual Report on Form 10-K for
        the fiscal year ended December 31, 2024, filed with the SEC on February 27,
        2025, as well as any amendment\nor update to our risk factors reflected in
        subsequent filings with the SEC, which are incorporated by reference into
        this prospectus\nsupplement or the accompanying prospectus, the information
        and documents incorporated by reference herein, and any free writing prospectus\nthat
        we have authorized for use in connection with this offering. If any of the
        identified risks actually occur, they could materially\nadversely affect our
        business, financial condition, operating results or prospects and the trading
        price of our securities. Additional\nrisks and uncertainties that we do not
        presently know or that we currently deem immaterial may also impair our business,
        financial condition,\noperating results and prospects and the trading price
        of our securities.</I></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\"><B>Risks\nRelating to this
        Offering</B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><B><I>We\nmay
        be unable to maintain compliance with The Nasdaq Marketplace Rules, which
        could cause our common stock to be delisted from the Nasdaq\nCapital Market.
        This could result in the lack of a market for our common stock, cause a decrease
        in the value of an investment in us,\nand adversely affect our business, financial
        condition, and results of operations.</I></B></FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">We\nhave in the past been unable to meet the
        requirement of the Nasdaq Stock Market LLC (&ldquo;Nasdaq&rdquo;) to maintain
        a minimum closing\nbid price of $1.00 per share, as set forth in Nasdaq Listing
        Rule 5550(a)(2) (the &ldquo;Minimum Bid Price Requirement&rdquo;). While\nour
        common stock price is currently in compliance with the Minimum Bid Price Requirement,
        it is possible that in the future it will again\nbe out of compliance, which
        could cause us to be subject to a delisting determination.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">We\nreceived a deficiency letter on May 19, 2025 from Nasdaq
        notifying us that we were no longer in compliance with the minimum stockholders&rsquo;\nequity
        requirement (the &ldquo;Minimum Stockholders&rsquo; Equity Requirement&rdquo;)
        for continued listing on the Nasdaq Capital Market\npursuant to Nasdaq Listing
        Rule 5550(b)(1). Pursuant to Nasdaq Listing Rule 5810(d)(2), the failure to
        comply with the Minimum Stockholders&rsquo;\nEquity Requirement was a separate
        basis for delisting.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">We\nhave
        not yet formally been advised by Nasdaq that we have regained compliance with
        the Minimum Stockholders&rsquo; Equity Requirement,\nalthough our stockholders&rsquo;
        equity has been above the necessary threshold for the past two fiscal quarters.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">If\nwe are unable to maintain compliance with Nasdaq&rsquo;s
        continued listing requirements in the future, and if our common stock is delisted\nby
        Nasdaq, it may be eligible for quotation on an over-the-counter quotation
        system or on the pink sheets. Upon any such delisting, our\ncommon stock would
        become subject to the regulations of the SEC relating to the market for penny
        stocks. A penny stock is any equity\nsecurity not traded on a national securities
        exchange that has a market price of less than $5.00 per share. The regulations
        applicable\nto penny stocks may severely affect the market liquidity for our
        common stock and could limit the ability of stockholders to sell securities\nin
        the secondary market. In such a case, an investor may find it more difficult
        to dispose of or obtain accurate quotations as to the\nmarket value of our
        common stock, and there can be no assurance that our common stock will be
        eligible for trading or quotation on any\nalternative exchanges or markets.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">Delisting\nfrom the Nasdaq Capital Market could adversely
        affect our ability to raise additional financing through public or private
        sales of equity\nsecurities, would significantly affect the ability of investors
        to trade our securities and would negatively affect the value and liquidity\nof
        our common stock. Delisting could also have other negative results, including
        the potential loss of confidence by employees, the loss\nof institutional
        investor interest and fewer business development opportunities.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B><I>&nbsp;</I></B></FONT></P>\n\n\n<!-- Field: Page; Sequence: 6;
        Value: 1 -->\n    <DIV STYLE=\"margin-bottom: 6pt; border-bottom: Black 1pt
        solid\"><TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" STYLE=\"border-collapse:
        collapse; width: 100%; font-size: 10pt\"><TR STYLE=\"vertical-align: top;
        text-align: left\"><TD STYLE=\"text-align: center; width: 100%\">S-<!-- Field:
        Sequence; Type: Arabic; Name: PageNo -->3<!-- Field: /Sequence --></TD></TR></TABLE></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt\">&nbsp;</DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0pt 0pt 0\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\"><B><I>&nbsp;</I></B></FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><B><I>Because\nwe
        will have broad discretion and flexibility in how the net proceeds from this
        offering are used, we may use the net proceeds in ways\nin which you disagree.</I></B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">We\nintend
        to use the net proceeds from this offering for general corporate purposes,
        including research and development activities, capital\nexpenditures and working
        capital. See &ldquo;Use of Proceeds&rdquo; on page S-7. We have not allocated
        specific amounts of the\nnet proceeds from this offering for any of the foregoing
        purposes. Accordingly, our management will have significant discretion and
        flexibility\nin applying the net proceeds of this offering. You will be relying
        on the judgment of our management with regard to the use of these\nnet proceeds,
        and you will not have the opportunity, as part of your investment decision,
        to assess whether the net proceeds are being\nused appropriately. It is possible
        that the net proceeds will be invested in a way that does not yield a favorable,
        or any, return for\nus. The failure of our management to use such funds effectively
        could have a material adverse effect on our business, financial condition,\noperating
        results and cash flow.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B><I>We\ndo not currently intend to pay cash dividends on our common
        stock, and any return to investors is expected to come, if at all, only from\npotential
        increases in the price of our common stock.</I></B></FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">At\nthe present time, we intend to use available
        funds to finance our operations. Accordingly, while payment of dividends rests
        within the\ndiscretion of our board of directors, we have no intention of
        paying any cash dividends in the foreseeable future. Any return to investors\non
        our common stock is expected to come, if at all, only from potential increases
        in the price of our common stock.</FONT></P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent:
        0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\"><B><I>Purchasers\nmay experience
        immediate dilution in the book value per share of the common stock purchased
        in the offering.</I></B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">The\noffering price per Share in this offering is substantially
        higher than the net tangible book value per share of our outstanding common\nstock.
        After giving effect to the sale of shares of our common stock in the aggregate
        amount of approximately $7.0 million at a combined\noffering price per Share
        and Warrant of $3.61 (or $3.6099 per Pre-funded Warrant and Warrant), and
        after deducting commissions and estimated\noffering expenses, our as adjusted
        net tangible book value as of September 30, 2025 would have been approximately
        $10.4 million or approximately\n$2.14 per share of common stock. This represents
        an immediate increase in net tangible book value of approximately $0.73 per
        share of\ncommon stock to our existing stockholders and an immediate dilution
        in net tangible book value of approximately $1.47 per share of common\nstock
        to purchasers of our common stock in this offering. See &ldquo;Dilution.&rdquo;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\"><B><I>You\nmay experience
        future dilution as a result of future equity offerings and other issuances
        of our securities. In addition, this offering\nand future equity offerings
        and other issuances of our common stock or other securities may adversely
        affect our common stock price.</I></B></FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">In\norder to raise additional capital, we
        may in the future offer additional shares of our common stock or other securities
        convertible into\nor exchangeable for our common stock. We may not be able
        to sell shares or other securities in any other offering at prices that equal\nto
        or greater than the price paid by any investor pursuant to this offering.
        In addition, investors purchasing shares or other securities\nin the future
        could have rights superior to existing stockholders. You will incur dilution
        upon exercise of any outstanding stock options,\nwarrants or upon the issuance
        of shares of common stock under our stock incentive programs. In addition,
        the sale of shares in this offering\nand any future sales of a substantial
        number of shares of our common stock in the public market, or the perception
        that such sales may\noccur, could adversely affect the price of our common
        stock. We cannot predict the effect, if any, that market sales of those shares\nof
        common stock or the availability of those shares of common stock for sale
        will have on the market price of our common stock.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\"><B><I>There\nis no public
        market for the Pre-funded Warrants or the Warrants being offered in this offering.</I></B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">There\nis no established public trading market for the Pre-funded
        Warrants or the Warrants being offered in this offering, and we do not expect\na
        market to develop. In addition, we do not intend to apply to list the Pre-funded
        Warrants or the Warrants on any national securities\nexchange or other nationally
        recognized trading system, including the Nasdaq Capital Market. Without an
        active market, the liquidity\nof the Pre-funded Warrants or the Warrants will
        be limited.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n\n<!--
        Field: Page; Sequence: 7; Value: 1 -->\n    <DIV STYLE=\"margin-bottom: 6pt;
        border-bottom: Black 1pt solid\"><TABLE CELLPADDING=\"0\" CELLSPACING=\"0\"
        STYLE=\"border-collapse: collapse; width: 100%; font-size: 10pt\"><TR STYLE=\"vertical-align:
        top; text-align: left\"><TD STYLE=\"text-align: center; width: 100%\">S-<!--
        Field: Sequence; Type: Arabic; Name: PageNo -->4<!-- Field: /Sequence --></TD></TR></TABLE></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt\">&nbsp;</DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0pt 0pt 0\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\"><B><I>&nbsp;</I></B></FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><B><I>Holders\nof
        our Pre-funded Warrants and Warrants will have no rights as a common stockholder
        until they acquire our common stock.</I></B></FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
