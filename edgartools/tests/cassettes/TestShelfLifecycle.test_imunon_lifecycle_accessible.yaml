        of our common stock reported on The Nasdaq\nCapital Market on April 1, 2024,
        a date within 60 days prior to the date of this prospectus. Pursuant to General
        Instruction I.B.6 of\nForm S-3, in no event will we sell our securities in
        a public primary offering with a value exceeding more than one-third of our
        public\nfloat in any 12-month period so long as our public float remains below
