        \   <DIV STYLE=\"break-before: page; margin-top: 6pt\"><P STYLE=\"margin:
        0pt\">&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">Only\nunderwriters named in the prospectus supplement will
        be underwriters of the securities offered by that prospectus supplement. The
        obligations\nof the underwriters to purchase the securities will be subject
        to the conditions set forth in the applicable underwriting agreement.\nWe
        may offer the securities to the public through underwriting syndicates represented
        by managing underwriters or by underwriters without\na syndicate. Unless otherwise
        indicated in the prospectus supplement, subject to certain conditions, the
        underwriters will be obligated\nto purchase all of the securities offered
        by the prospectus supplement, other than securities covered by any over-allotment
        option. Any\npublic offering price and any discounts or concessions allowed
        or reallowed or paid to dealers may change from time to time. We may use\nunderwriters
        with whom we have a material relationship. We will describe in the prospectus
        supplement, naming the underwriter, the nature\nof any such relationship.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">We\nmay use a remarketing firm to offer the securities in
        connection with a remarketing arrangement upon their purchase. Remarketing
        firms\nwill act as principals for their own account or as agents for us. These
        remarketing firms will offer or sell the securities pursuant\nto the terms
        of the securities. A prospectus supplement will identify any remarketing firm
        and the terms of its agreement, if any, with\nus and will describe the remarketing
        firm&rsquo;s compensation. Remarketing firms may be deemed to be underwriters
        in connection the\nsecurities they remarket.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">If\nwe
        offer and sell securities through a dealer, we or an underwriter will sell
        the securities to the dealer, as principal. The dealer\nmay resell the securities
        to the public at varying prices to be determined by the dealer at the time
        of resale. Any such dealer may be\ndeemed to be an underwriter of the securities
        offered and sold. The name of the dealer and the terms of the transaction
        will be set forth\nin the applicable prospectus supplement.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">We\nmay sell securities directly or through agents we designate
        from time to time. We will name any agent involved in the offering and sale\nof
        securities and we will describe any commissions we will pay the agent in the
        prospectus supplement. Unless the prospectus supplement\nstates otherwise,
        our agent will act on a best-efforts basis for the period of its appointment.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">We\nmay sell securities directly to one or more purchasers
        without using underwriters or agents. Underwriters, dealers and agents that
        participate\nin the distribution of the securities may be underwriters as
        defined in the Securities Act, and any discounts or commissions they receive\nfrom
        us and any profit on their resale of the securities may be treated as underwriting
        discounts and commissions under the Securities\nAct.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">We\nmay
        authorize agents or underwriters to solicit offers by certain types of institutional
        investors to purchase securities from us at\nthe public offering price set
        forth in the prospectus supplement pursuant to delayed delivery contracts
        providing for payment and delivery\non a specified date in the future. We
        will describe the conditions to these contracts and the commissions we must
        pay for solicitation\nof these contracts in the prospectus supplement.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">We\nmay provide agents and underwriters with indemnification
        against civil liabilities, including liabilities under the Securities Act,
        or\ncontribution with respect to payments that the agents or underwriters
        may make with respect to these liabilities. Agents and underwriters\nmay engage
        in transactions with, or perform services for, us in the ordinary course of
        business.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">We\nmay offer new issues of securities with no established
        trading market. Any underwriters may make a market in these securities, but
        will\nnot be obligated to do so and may discontinue any market making at any
        time without notice. We cannot guarantee the liquidity of the\ntrading markets
        for any securities.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">Any\nunderwriter may engage in over-allotment,
        stabilizing transactions, short-covering transactions and penalty bids in
        accordance with Regulation\nM under the Exchange Act. Over-allotment involves
        sales in excess of the offering size, which create a short position. Stabilizing
        transactions\npermit bids to purchase the underlying security so long as the
        stabilizing bids do not exceed a specified maximum price. Syndicate-covering\nor
        other short-covering transactions involve purchases of the securities, either
        through exercise of the over-allotment option or in\nthe open market after
        the distribution is completed, to cover short positions. Penalty bids permit
        the underwriters to reclaim a selling\nconcession from a dealer when the securities
        originally sold by the dealer are purchased in a stabilizing or covering transaction
        to\ncover short positions. Those activities may cause the price of the securities
        to be higher than it would otherwise be. If commenced,\nthe underwriters may
        discontinue any of the activities at any time.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">Any\nunderwriters
        that are qualified market makers on The Nasdaq Capital Market may engage in
        passive market making transactions in the common\nstock on The Nasdaq Capital
        Market in accordance with Regulation M under the Exchange Act. Passive market
        makers must comply with applicable\nvolume and price limitations and must
        be identified as passive market makers. Passive market making may stabilize
        the market price of\nthe securities at a level above that which might otherwise
        prevail in the open market and, if commenced, may be discontinued at any time.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n\n<!-- Field: Page; Sequence:
        25; Value: 1 -->\n    <DIV STYLE=\"margin-bottom: 6pt; border-bottom: Black
