        hereof. To\nthe extent that stock options have been or may be exercised, common
        stock awards vest, warrants have been or are exercised, or other\nshares have
        been or are issued, investors purchasing our common stock in this offering
        may experience further dilution. In addition,\nwe may choose to raise additional
        capital due to market conditions or strategic considerations even if we believe
        we have sufficient\nfunds for our current or future operating plans. To the
