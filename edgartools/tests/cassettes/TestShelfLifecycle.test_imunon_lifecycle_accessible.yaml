        10pt\"><B><A NAME=\"Su_009\"></A>DESCRIPTION\nOF DEBT SECURITIES</B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">We\nmay
        issue debt securities from time to time, in one or more series, as senior,
        subordinated or junior subordinated, convertible or non-convertible\nand secured
        or unsecured debt. Any senior debt securities will rank equally with any unsubordinated
        debt. Subordinated debt securities\nwill rank equally with any other subordinated
        debt of the same ranking we may issue. Convertible debt securities will be
        convertible\ninto or exchangeable for our common stock or other securities
        at predetermined conversion rates, and conversion may be mandatory or at\nthe
        holder&rsquo;s option.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">Debt\nsecurities will be issued under one or more indentures
        between us and a national banking association or other eligible party acting
        as\ntrustee. Following is a summary of certain general features of debt securities
        we may issue; we will describe the particular terms of\nany debt securities
        that we may offer in more detail in the applicable prospectus supplement,
        which may differ from the terms we describe\nbelow. You should read the prospectus
        supplements, any free writing prospectus we may authorize and the indentures,
        supplemental indentures\nand forms of debt securities relating to any series
        of debt securities we may offer.</FONT></P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent:
        0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
