        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: center\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\"><B><A NAME=\"sd_009\"></A>DESCRIPTION\nOF
        PRE-FUNDED WARRANTS</B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">The\nfollowing is a summary of the material
        terms and provisions of the Pre-funded Warrants that are being offered hereby.
        This summary is\nsubject to and qualified in its entirety by the form of Pre-funded
        Warrant, which will be filed with the SEC as an exhibit to a Current\nReport
        on Form 8-K in connection with this offering and incorporated by reference
        into the registration statement of which this prospectus\nsupplement and the
        accompanying prospectus form a part. Prospective investors should carefully
        review the terms and provisions of the\nform of Pre-funded Warrant for a complete
        description of the terms and conditions of the Pre-funded Warrants.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt; background-color: white\"><I>Duration\nand Exercise Price</I></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt; background-color: white\">Each\nPre-funded Warrant has an
        exercise price of </FONT><FONT STYLE=\"font-family: Times New Roman, Times,
        Serif; font-size: 10pt\">$0.0001\nper share. The Pre-funded Warrants will
        be <FONT STYLE=\"background-color: white\">exercisable immediately following
        the date of issuance\nand will not expire</FONT>. The exercise price and number
        of shares of common stock issuable upon exercise is subject to appropriate\nadjustment
        in the event of stock dividends, stock splits, reorganizations or similar
        events affecting our common stock and the exercise\nprice. <FONT STYLE=\"background-color:
        white\">The </FONT>Pre-funded <FONT STYLE=\"background-color: white\">Warrants
        will be issued separately\nfrom the Warrants offered pursuant to this prospectus
        supplement and may be transferred separately immediately thereafter. </FONT></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt; background-color: white\"><I>Exercisability</I></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt; background-color: white\">The\n</FONT><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">Pre-funded <FONT STYLE=\"background-color:
        white\">Warrants\nwill be exercisable, at the option of each holder, in whole
        or in part, by delivering a duly executed exercise notice accompanied by\npayment
        in full for the number of shares of our common stock purchased upon such exercise.
        Except as agreed with individual holders of\n</FONT>Pre-funded Warrants<FONT
        STYLE=\"background-color: white\">, a holder (together with its affiliates)
        may not exercise any portion\nof the </FONT>Pre-funded <FONT STYLE=\"background-color:
        white\">Warrant to the extent that the holder would own more than 4.99% (or,
        at\nthe election of the holder, 9.99% of our outstanding shares of common
        stock immediately after exercise (the &ldquo;Pre-funded Warrant\nBeneficial
        Ownership Limitation&rdquo;), except that upon at least 61 days&rsquo; prior
        notice from the holder to us, the holder may\nincrease the Pre-funded Warrant
        Beneficial Ownership Limitation to a percentage not to exceed 9.99%. No fractional
        shares of common stock\nwill be issued in connection with the exercise of
        a </FONT>Pre-funded <FONT STYLE=\"background-color: white\">Warrant. In lieu
        of fractional\nshares, we will pay the holder an amount in cash equal to the
        fractional amount multiplied by the exercise price.</FONT></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt; background-color: white\"><I>Cashless\nExercise</I></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">In\nlieu of making the cash payment otherwise contemplated
        to be made to us upon such exercise in payment of the aggregate exercise price,\na
        holder may elect instead to receive upon such exercise (either in whole or
        in part) the net number of shares of common stock determined\naccording to
        a formula set forth in the Pre-funded Warrants.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt; background-color:
        white\"><I>Fundamental\nTransaction</I></FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">In\nthe
        event of a fundamental transaction, as described in the Pre-funded Warrants
        and generally including merger or consolidation of our\nCompany or the sale
        of all or substantially all of our Company&rsquo;s capital stock or assets,
        the holders of the Pre-funded Warrants\nwill be entitled to receive upon exercise
        of the Pre-funded Warrants the kind and amount of securities, cash or other
        property that the\nholders would have received had they exercised the Pre-funded
        Warrants immediately prior to such fundamental transaction.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt; background-color:
        white\"><I>Transferability</I></FONT></P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent:
        0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
