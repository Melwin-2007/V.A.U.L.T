        0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><I>The\nfollowing is a summary of what we believe to be the most important
        aspects of our business and the offering of our securities under this\nprospectus.
        We urge you to read this entire prospectus, including the more detailed consolidated
        financial statements, notes to the consolidated\nfinancial statements and
        other information incorporated by reference from our other filings with the
        SEC or included in any applicable\nprospectus supplement. Investing in our
        securities involves risks. Therefore, carefully consider the risk factors
