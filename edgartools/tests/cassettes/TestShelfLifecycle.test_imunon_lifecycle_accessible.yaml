        virtue of such holder&rsquo;s ownership of shares of our common stock, the
        holders of the </FONT>Pre-funded <FONT STYLE=\"background-color: white\">Warrants\ndo
        not have the rights or privileges of holders of our common stock, including
        any voting rights, until they exercise their </FONT>Pre-funded\n<FONT STYLE=\"background-color:
        white\">Warrants. The </FONT>Pre-funded <FONT STYLE=\"background-color: white\">Warrants
        will provide that\nholders have the right to participate in distributions
