        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">We\nare offering directly to a single healthcare-focused
        institutional investor (the &ldquo;Purchaser&rdquo;) 330,000 shares (the &ldquo;Shares&rdquo;)\nof
        our common stock, par value $0.01 per share, or, in lieu of shares of our
        common stock to the extent the Purchaser so chooses, pre-funded\nwarrants
        (the &ldquo;Pre-funded Warrants&rdquo;) to purchase 1,609,114 shares of our
        common stock, in this offering, and warrants (the\n&ldquo;Warrants&rdquo;)
        to purchase up to 1,939,114 shares of our common stock (and the shares of
        common stock issuable from time to\ntime upon exercise of such Pre-funded
        Warrants and Warrants). The Shares, the Pre-funded Warrants, and the Warrants
        are being offered\npursuant to a securities purchase agreement, dated as of
        December 29, 2025 (the &ldquo;Purchase Agreement&rdquo;), by and among us
        and\nthe Purchaser. <FONT STYLE=\"background-color: white\">The Pre-funded
        Warrants have an exercise price of $0.0001 per share and will not\nexpire.
        The Warrants have an exercise price of $3.482 per share and will be exercisable
        immediately for a term of five years following\nthe date of issuance.</FONT>
        The combined offering price for each Share and accompanying Warrant is $3.61,
        and the combined offering\nprice for each Pre-funded Warrant and accompanying
        Warrant is $3.6099. Each of the Shares and Warrants, and the Pre-funded Warrants
        and\nWarrants can only be purchased together in this offering but will be
        issued separately and will be immediately separable upon issuance.\nWe are
        also offering the shares of common stock that are issuable from time to time
        upon exercise of the Pre-funded Warrants and the\nWarrants.</FONT></P>\n\n<P
