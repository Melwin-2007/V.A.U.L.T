        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt; background-color:
        white\">Subject\nto applicable laws, a </FONT><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt\">Pre-funded <FONT STYLE=\"background-color:
        white\">Warrant\nmay be transferred at the option of the holder upon surrender
        of the </FONT>Pre-funded <FONT STYLE=\"background-color: white\">Warrant,\nas
        applicable, together with the appropriate instruments of transfer and funds
        sufficient to pay any transfer taxes payable upon such\ntransfer.</FONT></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt; background-color: white\"><I>Trading\nMarket and Exchange
        Listing</I></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0pt 0pt 0; text-align: justify; text-indent: 0.5in\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt; background-color: white\">There\nis no trading market available
        for the </FONT><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">Pre-funded <FONT STYLE=\"background-color: white\">Warrants\non any
        securities exchange or nationally recognized trading system, and we do not
        expect a trading market to develop. We do not intend\nto list the </FONT>Pre-funded
        <FONT STYLE=\"background-color: white\">Warrants on any securities exchange
        or nationally recognized trading\nmarket. Without a trading market, the liquidity
        of the </FONT>Pre-funded <FONT STYLE=\"background-color: white\">Warrants
        will be extremely\nlimited. The shares of common stock issuable upon exercise
        of the </FONT>Pre-funded <FONT STYLE=\"background-color: white\">Warrants
        are\ncurrently traded on the Nasdaq Capital Market.</FONT></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify;
        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt; background-color: white\"><I>Right\nas a Stockholder</I></FONT></P>\n\n<P
