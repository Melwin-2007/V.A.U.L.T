        Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify; text-indent:
        0.45in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">We\nmay issue rights to our stockholders to purchase shares of our
        common stock, preferred stock or the other securities described in this\nprospectus.
        We may offer rights separately or together with one or more additional rights,
        debt securities, preferred stock, common stock\nor warrants, or any combination
        of those securities in the form of units, as described in the applicable prospectus
        supplement. Each\nseries of rights will be issued under a separate rights
        agreement to be entered into between us and a bank or trust company, as rights\nagent.
        The rights agent will act solely as our agent in connection with the certificates
        relating to the rights of the series of certificates\nand will not assume
        any obligation or relationship of agency or trust for or with any holders
        of rights certificates or beneficial owners\nof rights. The following description
        sets forth certain general terms and provisions of the rights to which any
        prospectus supplement\nmay relate. The particular terms of the rights to which
        any prospectus supplement may relate and the extent, if any, to which the
        general\nprovisions may apply to the rights so offered will be described in
        the applicable prospectus supplement. To the extent that any particular\nterms
        of the rights, rights agreement or rights certificates described in a prospectus
        supplement differ from any of the terms described\nbelow, then the terms described
        below will be deemed to have been superseded by that prospectus supplement.
        We encourage you to read\nthe applicable rights agreement and rights certificate
        for additional information before you decide whether to purchase any of our
        rights.\nWe will provide in a prospectus supplement the following terms of
