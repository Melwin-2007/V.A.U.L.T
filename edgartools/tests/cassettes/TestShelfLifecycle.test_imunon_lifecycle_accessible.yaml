        text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif;
        font-size: 10pt\">We\nwill deliver the securities being issued to the Purchaser
        upon receipt of Purchaser funds for the purchase of the securities offered\npursuant
        to this prospectus. We expect to deliver the securities being offered pursuant
        to this prospectus on or about December 31, 2025,\nsubject to satisfaction
        of customary closing conditions. There is no minimum number of securities
        or amount of proceeds that is a condition\nto closing of this offering.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify; text-indent: 0.5in\"><FONT STYLE=\"font-family: Times New Roman,
