        dividends, but rather merely represent the right to acquire shares of common
        stock at a fixed price. Specifically,\ncommencing on the date of issuance,
        holders of the Pre-funded Warrants may acquire the common stock issuable upon
        exercise of such Warrants\nat an exercise price of $0.0001 per share and holders
        of the Warrants may acquire the common stock issuable upon exercise of such
        Warrants\nat an exercise price of $3.482 per share. Moreover, following this
        offering, the market value of the Pre-funded Warrants and the Warrants\nis
        uncertain and there can be no assurance that the market value of the Pre-funded
        Warrants and the Warrants will equal or exceed their\noffering price. There
        can be no assurance that the market price of the common stock will ever equal
        or exceed the exercise price of the\nWarrants and consequently, whether it
