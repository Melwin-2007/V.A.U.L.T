# Configurable Year-on-Year (YoY) Financial Validation Thresholds
# Percentages represent absolute YoY change limits: abs(pct_change) > threshold -> fail.

default_pct: 40.0
warn_ratio: 0.75

confidence_multipliers:
  fail: 0.60
  warn: 0.85

metrics:
  revenue: 50.0
  net_income: 150.0
  total_assets: 30.0
  total_liabilities: 40.0
  shareholders_equity: 40.0
  operating_cash_flow: 60.0

